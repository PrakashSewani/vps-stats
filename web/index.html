<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>VPS Stats</title>
  <style>
    :root {
      --background: #090d12;
      --surface: #121923;
      --surface-raised: #182231;
      --text: #f3f7fb;
      --muted: #9aa9ba;
      --green: #39d98a;
      --amber: #f6bd3b;
      --red: #ff5c68;
      --grey: #7f8b99;
      --border: #2a3748;
      --track: #263344;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--background);
    }

    body {
      min-width: 280px;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      line-height: 1.45;
    }

    .banner {
      position: sticky;
      z-index: 10;
      top: 0;
      width: 100%;
      padding: 0.7rem 1rem;
      border-bottom: 1px solid #ff8c95;
      background: #7a1721;
      color: #fff;
      font-weight: 800;
      text-align: center;
    }

    .banner[hidden] {
      display: none;
    }

    .banner.is-loading {
      border-color: var(--border);
      background: var(--surface-raised);
      color: var(--muted);
    }

    .page-header,
    main,
    footer {
      width: min(1120px, calc(100% - 2rem));
      margin-inline: auto;
    }

    .page-header {
      padding: 1.5rem 0 1rem;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 0.2rem;
      font-size: clamp(1.45rem, 4vw, 2rem);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      align-items: start;
    }

    .host-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-top: 4px solid var(--grey);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 12px 32px rgb(0 0 0 / 22%);
    }

    .host-card.state-live {
      border-top-color: var(--green);
    }

    .host-card.state-amber {
      border-top-color: var(--amber);
    }

    .host-card.state-stale,
    .host-card.state-error {
      border-top-color: var(--red);
    }

    .host-card.state-asleep {
      border-top-color: var(--grey);
      background: #10151c;
    }

    .host-card.fetch-failed {
      border-top-color: var(--grey);
      filter: grayscale(1);
      opacity: 0.66;
    }

    .host-card.fetch-failed .status-pill {
      background: var(--grey);
      color: #071018;
    }

    .card-header {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 0.7rem;
      align-items: start;
      padding: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .host-emoji {
      font-size: 1.45rem;
      line-height: 1.2;
    }

    .host-title {
      min-width: 0;
    }

    .host-title h2 {
      overflow-wrap: anywhere;
      margin: 0;
      font-size: 1rem;
      line-height: 1.25;
    }

    .host-model,
    .updated,
    .metric-note,
    .mount,
    .history-label,
    .state-note,
    .last-known-label,
    .empty-data {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .host-model {
      margin: 0.2rem 0 0;
    }

    .header-status {
      text-align: right;
    }

    .status-pill {
      display: inline-block;
      min-width: 4.6rem;
      padding: 0.2rem 0.45rem;
      border-radius: 999px;
      background: var(--grey);
      color: #071018;
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-align: center;
    }

    .pill-live {
      background: var(--green);
    }

    .pill-amber {
      background: var(--amber);
    }

    .pill-stale,
    .pill-error {
      background: var(--red);
    }

    .pill-asleep {
      background: var(--grey);
    }

    .updated {
      display: block;
      margin-top: 0.35rem;
      white-space: nowrap;
    }

    .state-note,
    .last-known-label,
    .empty-data {
      margin: 0;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    .state-note:empty,
    .last-known-label[hidden],
    .empty-data[hidden] {
      display: none;
    }

    .state-stale .state-note,
    .state-error .state-note {
      color: #ffabb1;
    }

    .state-amber .state-note {
      color: var(--amber);
    }

    .last-known-label {
      color: #c0cad5;
      font-weight: 700;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .metrics.last-known {
      color: #b3beca;
    }

    .metrics.last-known .metric-content {
      opacity: 0.58;
    }

    .metric {
      min-width: 0;
      padding: 0.9rem 1rem;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .metric:nth-child(even) {
      border-right: 0;
    }

    .metric h3 {
      margin-bottom: 0.55rem;
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .metric-wide {
      grid-column: 1 / -1;
      border-right: 0;
    }

    .metric-value {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: 0.94rem;
      font-weight: 750;
    }

    .metric-value-big {
      font-size: clamp(1.55rem, 5vw, 2.25rem);
      line-height: 1;
    }

    .metric-note,
    .mount,
    .history-label {
      margin: 0.35rem 0 0;
    }

    .bar {
      height: 7px;
      margin-top: 0.65rem;
      overflow: hidden;
      border-radius: 999px;
      background: var(--track);
    }

    .bar-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--green);
    }

    .state-amber .bar-fill {
      background: var(--amber);
    }

    .state-stale .bar-fill,
    .state-error .bar-fill {
      background: var(--red);
    }

    .sparkline {
      display: block;
      width: 100%;
      height: 48px;
      margin-top: 0.65rem;
      color: var(--green);
    }

    .state-amber .sparkline {
      color: var(--amber);
    }

    .state-stale .sparkline,
    .state-error .sparkline {
      color: var(--red);
    }

    .state-asleep .sparkline,
    .last-known .sparkline {
      color: var(--grey);
    }

    .state-asleep .bar-fill,
    .last-known .bar-fill {
      background: var(--grey);
    }

    .sparkline-guide {
      stroke: var(--track);
      stroke-width: 1;
    }

    .sparkline-line {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .sparkline-point {
      fill: currentColor;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.3rem 1rem;
      margin: 0;
    }

    .details div {
      min-width: 0;
    }

    .details dt {
      color: var(--muted);
      font-size: 0.7rem;
      text-transform: uppercase;
    }

    .details dd {
      margin: 0.12rem 0 0;
      overflow-wrap: anywhere;
      font-size: 0.88rem;
    }

    footer {
      padding: 1rem 0 1.5rem;
      color: var(--muted);
      font-size: 0.72rem;
      overflow-wrap: anywhere;
    }

    noscript p {
      width: min(1120px, calc(100% - 2rem));
      margin: 1rem auto;
      padding: 1rem;
      border: 1px solid var(--red);
      border-radius: 8px;
      background: var(--surface);
    }

    a {
      color: #8bc8ff;
    }

    @media (max-width: 719px) {
      .cards {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 390px) {
      .page-header,
      main,
      footer {
        width: min(100% - 1rem, 1120px);
      }

      .card-header {
        grid-template-columns: auto minmax(0, 1fr);
      }

      .header-status {
        grid-column: 2;
        text-align: left;
      }

      .updated {
        display: inline;
        margin-left: 0.35rem;
      }

      .metrics {
        grid-template-columns: 1fr;
      }

      .metric,
      .metric:nth-child(even) {
        border-right: 0;
      }

      .details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="banner" class="banner is-loading" role="status" aria-live="polite">LOADING — waiting for /api/stats</div>

  <header class="page-header">
    <h1>VPS stats</h1>
    <p class="subtitle">Tailnet-only host telemetry</p>
  </header>

  <main>
    <div id="cards" class="cards" aria-busy="true"></div>
  </main>

  <footer id="footer">GET /api/stats · schema — · v— · refreshed every 30s · generated —</footer>

  <noscript>
    <p>This page needs JavaScript. Use <a href="/api/stats"><code>curl /api/stats</code></a> as the alternative.</p>
  </noscript>

  <script>
    'use strict';

    const API = '/api/stats';

    (() => {
      const REFRESH_DELAY_MS = 30_000;
      const HISTORY_WINDOW_SECONDS = 30 * 60;
      const VPS_AMBER_AT_SECONDS = 45;
      const VPS_STALE_AT_SECONDS = 90;
      const MAC_AMBER_AT_SECONDS = 90;
      const MAC_STALE_AT_SECONDS = 180;
      const EM_DASH = '—';
      const SVG_NS = 'http://www.w3.org/2000/svg';

      const banner = document.getElementById('banner');
      const cards = document.getElementById('cards');
      const footer = document.getElementById('footer');

      let latestData = null;
      let hostViews = [];
      // Age anchor captured on every successful fetch: the server's clock (from the
      // response Date header) and the browser clock at the same instant. The server's
      // clock is authoritative for data the server generated, so a skewed browser clock
      // cannot disguise an old document.
      let ageAnchor = null;
      let refreshTimer = null;
      let fetchInFlight = false;
      let refreshRequested = false;
      let fetchFailed = false;

      function finiteNumber(value) {
        return typeof value === 'number' && Number.isFinite(value) ? value : null;
      }

      function serverTimeSeconds(response) {
        const header = response && response.headers && response.headers.get('date');
        if (!header) return null;
        const parsed = Date.parse(header);
        return Number.isFinite(parsed) ? parsed / 1000 : null;
      }

      function agedSince(epoch) {
        if (epoch === null) return null;
        // Degraded path: no usable Date header (nginx always sends one), so fall back to
        // the browser clock. Still honest about a stalled exporter, but it trusts the
        // browser's clock — the very thing the server anchor exists to avoid.
        if (ageAnchor === null) return Math.max(0, Date.now() / 1000 - epoch);
        // First term: the data's true age on the server's clock at fetch time (zero for a
        // live exporter, 370 for a dead one). Second term: how long this tab has held that
        // fetch — a duration, so a wrong browser clock cannot affect it.
        //
        // Trap: never anchor the age on the document's own generated_at timestamp. Doing so
        // cancels the document's age out and makes every document look brand new the first
        // time it is fetched — the green-on-a-dead-box failure this page must never have.
        return Math.max(0, (ageAnchor.serverEpoch - epoch) + (Date.now() / 1000 - ageAnchor.clientEpoch));
      }

      function formatNumber(value, maximumFractionDigits = 1) {
        const number = finiteNumber(value);
        if (number === null) return EM_DASH;
        return number.toLocaleString('en-IN', {
          maximumFractionDigits,
          minimumFractionDigits: 0
        });
      }

      function formatInteger(value) {
        return formatNumber(value, 0);
      }

      function formatPercent(value) {
        const formatted = formatNumber(value, 1);
        return formatted === EM_DASH ? EM_DASH : formatted + '%';
      }

      function formatGigabytes(value) {
        const formatted = formatNumber(value, 2);
        return formatted === EM_DASH ? EM_DASH : formatted + ' GB';
      }

      function formatText(value) {
        return value === null || value === undefined || value === '' ? EM_DASH : String(value);
      }

      // One convention for "how many minutes old": the card ("updated 6 minutes ago") and the
      // banner ("6 min old") describe the same document, so they must not disagree on screen.
      // Floors, never rounds — a countdown that rounds up claims more age than the clock shows.
      function ageMinutes(ageSeconds) {
        const age = finiteNumber(ageSeconds);
        if (age === null) return null;
        return Math.max(0, Math.floor(age / 60));
      }

      function formatAge(ageSeconds) {
        const age = finiteNumber(ageSeconds);
        if (age === null) return 'updated ' + EM_DASH;
        if (age < 3) return 'updated just now';
        const rounded = Math.max(0, Math.floor(age));
        if (rounded < 60) {
          return 'updated ' + formatInteger(rounded) + ' second' + (rounded === 1 ? '' : 's') + ' ago';
        }
        const minutes = ageMinutes(rounded);
        if (minutes < 60) {
          return 'updated ' + formatInteger(minutes) + ' minute' + (minutes === 1 ? '' : 's') + ' ago';
        }
        const hours = Math.floor(minutes / 60);
        return 'updated ' + formatInteger(hours) + ' hour' + (hours === 1 ? '' : 's') + ' ago';
      }

      function createElement(tagName, className, text) {
        const element = document.createElement(tagName);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
      }

      function createBar(percent) {
        const track = createElement('div', 'bar');
        track.setAttribute('aria-hidden', 'true');
        const fill = createElement('div', 'bar-fill');
        const value = finiteNumber(percent);
        fill.style.width = formatNumber(value === null ? 0 : Math.min(100, Math.max(0, value)), 1) + '%';
        track.append(fill);
        return track;
      }

      function historySettings(data, kind, values) {
        const history = data && data.history && typeof data.history === 'object' ? data.history : {};
        const hostInterval = kind === 'mac' ? finiteNumber(history.mac_interval_s) : null;
        const interval = hostInterval === null ? finiteNumber(history.interval_s) : hostInterval;
        const capacity = finiteNumber(history.capacity);
        let windowSeconds = null;
        let maxSamples = values.length;

        if (interval !== null && interval > 0) {
          const configuredSeconds = capacity !== null && capacity > 0 ? interval * capacity : values.length * interval;
          windowSeconds = Math.min(HISTORY_WINDOW_SECONDS, configuredSeconds);
          maxSamples = Math.max(1, Math.ceil(windowSeconds / interval));
        }

        return {
          interval,
          windowSeconds,
          values: values.slice(-maxSamples),
          maxSamples
        };
      }

      function formatDuration(seconds) {
        const value = finiteNumber(seconds);
        if (value === null) return EM_DASH;
        if (value < 60) return formatInteger(Math.round(value)) + ' sec';
        if (value < 3600) return formatNumber(value / 60, value % 60 === 0 ? 0 : 1) + ' min';
        return formatNumber(value / 3600, 1) + ' hr';
      }

      function formatHistoryLabel(settings) {
        const sampleCount = settings.values.length;
        if (sampleCount === 0) return 'no history yet';
        if (settings.interval === null || settings.interval <= 0) {
          return formatInteger(sampleCount) + ' sample' + (sampleCount === 1 ? '' : 's');
        }

        const actualSeconds = Math.min(
          settings.windowSeconds === null ? sampleCount * settings.interval : settings.windowSeconds,
          sampleCount * settings.interval
        );
        const complete = settings.windowSeconds !== null && sampleCount >= settings.maxSamples;
        const label = 'last ' + formatDuration(complete ? settings.windowSeconds : actualSeconds);
        return complete ? label : label + ' · ' + formatInteger(sampleCount) + ' sample' + (sampleCount === 1 ? '' : 's');
      }

      function createSparkline(settings) {
        const svg = document.createElementNS(SVG_NS, 'svg');
        svg.classList.add('sparkline');
        svg.setAttribute('viewBox', '0 0 240 48');
        svg.setAttribute('preserveAspectRatio', 'none');
        svg.setAttribute('aria-hidden', 'true');
        svg.setAttribute('focusable', 'false');

        const guide = document.createElementNS(SVG_NS, 'line');
        guide.setAttribute('x1', '0');
        guide.setAttribute('x2', '240');
        guide.setAttribute('y1', '47');
        guide.setAttribute('y2', '47');
        guide.setAttribute('class', 'sparkline-guide');
        svg.append(guide);

        const denominator = Math.max(1, settings.values.length - 1);
        let segment = [];

        function appendSegment() {
          if (segment.length === 0) return;
          if (segment.length === 1) {
            const point = document.createElementNS(SVG_NS, 'circle');
            point.setAttribute('cx', formatNumber(segment[0][0], 2));
            point.setAttribute('cy', formatNumber(segment[0][1], 2));
            point.setAttribute('r', '2.5');
            point.setAttribute('class', 'sparkline-point');
            svg.append(point);
          } else {
            const line = document.createElementNS(SVG_NS, 'polyline');
            line.setAttribute('points', segment.map((point) => formatNumber(point[0], 2) + ',' + formatNumber(point[1], 2)).join(' '));
            line.setAttribute('class', 'sparkline-line');
            svg.append(line);
          }
          segment = [];
        }

        settings.values.forEach((rawValue, index) => {
          const value = finiteNumber(rawValue);
          if (value === null) {
            appendSegment();
            return;
          }
          const x = (index / denominator) * 240;
          const y = 46 - (Math.min(100, Math.max(0, value)) / 100) * 44;
          segment.push([x, y]);
        });
        appendSegment();

        return svg;
      }

      function createMetric(title, wide = false) {
        const metric = createElement('div', 'metric' + (wide ? ' metric-wide' : ''));
        metric.append(createElement('h3', '', title));
        const content = createElement('div', 'metric-content');
        metric.append(content);
        return {metric, content};
      }

      function createCpuMetric(host, data, kind) {
        const item = createMetric('CPU', true);
        const cpu = host && host.cpu && typeof host.cpu === 'object' ? host.cpu : {};
        const value = createElement('p', 'metric-value metric-value-big', formatPercent(cpu.busy_pct));
        const cores = finiteNumber(cpu.cores);
        const note = createElement(
          'p',
          'metric-note',
          'on ' + formatInteger(cores) + ' ' + (cores === 1 ? 'core' : 'cores')
        );
        const source = data && data.history && data.history[kind] && Array.isArray(data.history[kind].cpu_pct)
          ? data.history[kind].cpu_pct
          : [];
        const settings = historySettings(data, kind, source);
        item.content.append(value, note, createSparkline(settings), createElement('p', 'history-label', formatHistoryLabel(settings)));
        return item.metric;
      }

      function createMemoryMetric(host, data, kind) {
        const item = createMetric('RAM', true);
        const memory = host && host.memory && typeof host.memory === 'object' ? host.memory : {};
        const primary = formatGigabytes(memory.used_gb) + ' / ' + formatGigabytes(memory.total_gb) + ' · ' + formatPercent(memory.used_pct);
        const freeMemory = finiteNumber(memory.free_gb) === null ? memory.available_gb : memory.free_gb;
        const secondaryParts = ['free ' + formatGigabytes(freeMemory)];
        if (kind === 'mac') secondaryParts.push('cached ' + formatGigabytes(memory.cached_gb));
        const source = data && data.history && data.history[kind] && Array.isArray(data.history[kind].mem_pct)
          ? data.history[kind].mem_pct
          : [];
        const settings = historySettings(data, kind, source);
        item.content.append(
          createElement('p', 'metric-value', primary),
          createElement('p', 'metric-note', secondaryParts.join(' · ')),
          createBar(memory.used_pct),
          createSparkline(settings),
          createElement('p', 'history-label', formatHistoryLabel(settings))
        );
        return item.metric;
      }

      function createDiskMetric(host) {
        const item = createMetric('Disk');
        const disk = host && host.disk && typeof host.disk === 'object' ? host.disk : {};
        const primary = formatGigabytes(disk.used_gb) + ' / ' + formatGigabytes(disk.total_gb) + ' (' + formatPercent(disk.used_pct) + ')';
        item.content.append(
          createElement('p', 'metric-value', primary),
          createBar(disk.used_pct),
          createElement('p', 'mount', 'mount ' + formatText(disk.mount))
        );
        return item.metric;
      }

      function createSwapMetric(host) {
        const item = createMetric('Swap');
        const swap = host && host.swap && typeof host.swap === 'object' ? host.swap : {};
        const total = finiteNumber(swap.total_gb);
        const value = total === null || total === 0
          ? EM_DASH
          : formatGigabytes(swap.used_gb) + ' / ' + formatGigabytes(total);
        item.content.append(createElement('p', 'metric-value', value));
        return item.metric;
      }

      function addDetail(list, term, value) {
        const wrapper = createElement('div');
        wrapper.append(createElement('dt', '', term), createElement('dd', '', value));
        list.append(wrapper);
      }

      function createDetailsMetric(host, kind) {
        const item = createMetric('System', true);
        const load = host && host.load && typeof host.load === 'object' ? host.load : {};
        const details = createElement('dl', 'details');
        addDetail(
          details,
          'Load 1m / 5m / 15m',
          formatNumber(load['1m'], 2) + ' / ' + formatNumber(load['5m'], 2) + ' / ' + formatNumber(load['15m'], 2)
        );
        addDetail(details, 'Uptime', formatText(host && host.uptime));
        if (kind === 'mac') addDetail(details, 'Screen', formatText(host && host.screen));
        item.content.append(details);
        return item.metric;
      }

      function hasLastKnownNumbers(host) {
        if (!host || typeof host !== 'object') return false;
        const candidates = [
          host.cpu && host.cpu.busy_pct,
          host.memory && host.memory.used_gb,
          host.memory && host.memory.used_pct,
          host.disk && host.disk.used_gb,
          host.disk && host.disk.used_pct,
          host.swap && host.swap.used_gb,
          host.load && host.load['1m'],
          host.uptime_s
        ];
        return candidates.some((value) => finiteNumber(value) !== null);
      }

      function hostAge(host) {
        return agedSince(finiteNumber(host && host.generated_at_epoch));
      }

      function hostState(kind, host, age) {
        if (!host || typeof host !== 'object') return 'stale';

        if (kind === 'mac') {
          if (host.status === 'error') return 'error';
          if (host.status !== 'online') return 'asleep';
        } else if (host.status !== 'online') {
          return 'stale';
        }

        if (age === null) return 'stale';
        if (kind === 'vps') {
          if (age >= VPS_STALE_AT_SECONDS) return 'stale';
          if (age >= VPS_AMBER_AT_SECONDS) return 'amber';
        } else {
          if (age >= MAC_STALE_AT_SECONDS) return 'stale';
          if (age >= MAC_AMBER_AT_SECONDS) return 'amber';
        }
        return 'live';
      }

      function stateMessage(kind, host, state, age) {
        if (state === 'error') return 'ERROR — ' + formatText(host && host.detail);
        if (state === 'asleep') return 'ASLEEP — no live numbers';
        if (state === 'stale') {
          if (age === null) return 'STALE — timestamp unavailable';
          if (kind === 'vps' && host && host.status !== 'online') return 'STALE — host not online';
          return 'STALE — exporter silent';
        }
        if (state === 'amber') return 'AMBER — sample is aging';
        return '';
      }

      function createHostCard(kind, host, data) {
        const card = createElement('section', 'host-card');
        card.setAttribute('aria-labelledby', kind + '-title');

        const header = createElement('header', 'card-header');
        const emoji = createElement('span', 'host-emoji', kind === 'vps' ? '🖥️' : '💻');
        emoji.setAttribute('aria-hidden', 'true');

        const titleGroup = createElement('div', 'host-title');
        const fallbackName = kind === 'vps' ? 'VPS' : 'Mac';
        const title = createElement('h2', '', formatText(host && host.name) === EM_DASH ? fallbackName : formatText(host.name));
        title.id = kind + '-title';
        titleGroup.append(title);
        if (kind === 'mac') titleGroup.append(createElement('p', 'host-model', formatText(host && host.model)));

        const statusGroup = createElement('div', 'header-status');
        const pill = createElement('span', 'status-pill', 'STALE');
        const updated = createElement('span', 'updated', formatAge(null));
        statusGroup.append(pill, updated);
        header.append(emoji, titleGroup, statusGroup);

        const stateNote = createElement('p', 'state-note');
        const lastKnown = createElement('p', 'last-known-label');
        lastKnown.hidden = true;
        const time = createElement('time', '', formatText(host && host.generated_at));
        if (host && typeof host.generated_at === 'string') time.dateTime = host.generated_at;
        lastKnown.append(document.createTextNode('Last-known at '), time);

        const emptyData = createElement('p', 'empty-data', 'No last-known numbers available.');
        emptyData.hidden = true;
        const metrics = createElement('div', 'metrics');
        metrics.append(
          createCpuMetric(host, data, kind),
          createMemoryMetric(host, data, kind),
          createDiskMetric(host),
          createSwapMetric(host),
          createDetailsMetric(host, kind)
        );

        card.append(header, stateNote, lastKnown, emptyData, metrics);
        return {kind, host, card, pill, updated, stateNote, lastKnown, emptyData, metrics};
      }

      function renderDashboard(data) {
        const hosts = data && data.hosts && typeof data.hosts === 'object' ? data.hosts : {};
        const vps = hosts.vps && typeof hosts.vps === 'object' ? hosts.vps : null;
        const mac = hosts.mac && typeof hosts.mac === 'object' ? hosts.mac : null;
        hostViews = [createHostCard('vps', vps, data), createHostCard('mac', mac, data)];
        cards.replaceChildren(...hostViews.map((view) => view.card));
        cards.setAttribute('aria-busy', data ? 'false' : 'true');
        updateAgesAndFreshness();
      }

      function updateHostView(view) {
        const age = hostAge(view.host);
        const state = hostState(view.kind, view.host, age);
        const lastKnownState = view.kind === 'mac' && (state === 'stale' || state === 'asleep' || state === 'error');
        const hasNumbers = hasLastKnownNumbers(view.host);

        view.card.className = 'host-card state-' + state + (fetchFailed ? ' fetch-failed' : '');
        view.pill.className = 'status-pill pill-' + state;
        view.pill.textContent = state.toUpperCase();
        view.updated.textContent = formatAge(age);
        view.stateNote.textContent = stateMessage(view.kind, view.host, state, age);
        view.lastKnown.hidden = !lastKnownState || !hasNumbers;
        view.emptyData.hidden = !lastKnownState || hasNumbers;
        view.metrics.hidden = lastKnownState && !hasNumbers;
        view.metrics.classList.toggle('last-known', lastKnownState);
      }

      function documentAge() {
        return agedSince(finiteNumber(latestData && latestData.generated_at_epoch));
      }

      function updateBanner() {
        if (fetchFailed) {
          banner.className = 'banner';
          banner.hidden = false;
          banner.textContent = 'UNREACHABLE — ' + API + ' did not answer';
          return;
        }
        if (!latestData) return;

        const age = documentAge();
        const stale = age === null || age >= VPS_STALE_AT_SECONDS;
        if (stale) {
          const minutes = age === null ? null : Math.max(1, ageMinutes(age));
          banner.className = 'banner';
          banner.hidden = false;
          banner.textContent = minutes === null
            ? 'EXPORTER SILENT — the document carries no usable timestamp'
            : 'EXPORTER SILENT — the numbers below are ' + formatInteger(minutes) + ' min old';
        } else {
          banner.hidden = true;
          banner.textContent = '';
        }
      }

      function updateAgesAndFreshness() {
        hostViews.forEach(updateHostView);
        updateBanner();
      }

      function updateFooter(data) {
        footer.replaceChildren(
          document.createTextNode('GET ' + API),
          document.createTextNode(' · schema ' + formatInteger(data && data.schema)),
          document.createTextNode(' · v' + formatText(data && data.version)),
          document.createTextNode(' · refreshed every ' + formatInteger(REFRESH_DELAY_MS / 1000) + 's'),
          document.createTextNode(' · generated ' + formatText(data && data.generated_at))
        );
      }

      function scheduleRefresh() {
        window.clearTimeout(refreshTimer);
        refreshTimer = null;
        if (!document.hidden) refreshTimer = window.setTimeout(refreshStats, REFRESH_DELAY_MS);
      }

      async function refreshStats() {
        if (document.hidden) return;
        if (fetchInFlight) {
          refreshRequested = true;
          return;
        }

        refreshRequested = false;
        fetchInFlight = true;
        try {
          const response = await fetch(API, {cache: 'no-store', headers: {'Accept': 'application/json'}});
          if (!response.ok) throw new Error('HTTP response was not successful');
          const data = await response.json();
          if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('JSON root was not an object');

          const serverEpoch = serverTimeSeconds(response);
          ageAnchor = serverEpoch === null ? null : {serverEpoch, clientEpoch: Date.now() / 1000};
          latestData = data;
          fetchFailed = false;
          renderDashboard(data);
          updateFooter(data);
        } catch (error) {
          fetchFailed = true;
          updateAgesAndFreshness();
        } finally {
          fetchInFlight = false;
          if (refreshRequested && !document.hidden) {
            refreshRequested = false;
            refreshStats();
          } else {
            scheduleRefresh();
          }
        }
      }

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          window.clearTimeout(refreshTimer);
          refreshTimer = null;
        } else {
          refreshStats();
        }
      });

      renderDashboard(null);
      window.setInterval(updateAgesAndFreshness, 1000);
      refreshStats();
    })();
  </script>
</body>
</html>
