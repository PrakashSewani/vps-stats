# vps-stats — nginx site configuration.
#
# Provenance: this file is owned by the vps-stats repository
# (https://github.com/PrakashSewani/vps-stats) and installed by deploy/install.sh as
# /etc/nginx/sites-available/vps-stats.conf. Do not hand-edit it on the box; edit the
# repository and redeploy, or the next install overwrites the change.
#
# Deliberately binds 127.0.0.1 only. Nothing here answers on a public interface, so there is no
# origin a public request could bypass; `tailscale serve` is the only thing that fronts this.
server {
    listen 127.0.0.1:8080;
    server_tokens off;

    root /opt/vps-stats/web;
    index index.html;
    autoindex off;

    access_log /var/log/nginx/vps-stats.access.log;
    error_log  /var/log/nginx/vps-stats.error.log;

    # The CSP allows exactly what the page needs: its single inline <style> and <script>, a
    # data: favicon, and fetch('/api/stats') on the same origin. Everything else is denied.
    #
    # nginx inherits add_header from an enclosing block ONLY when the current block defines
    # none of its own. Both locations below define headers, so each repeats the full security
    # set. Do not "clean this up" into a shared block: deleting the repeats silently drops the
    # headers for that location. Every header carries `always` so it survives non-2xx responses.
    location = /api/stats {
        alias /var/lib/vps-stats/stats.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    location / {
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }
}
